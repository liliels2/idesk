<body>

    <button class="navbtn active" data-tab="home"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>star-crescent-solid</title><path fill="currentColor" d="M14 21h3v1h-2v1H9v-1H7v-1H5v-1H4v-1H3v-2H2v-2H1V9h1V7h1V5h1V4h1V3h2V2h2V1h6v1h2v1h-3v1h-2v1h-2v1H9v2H8v2H7v4h1v2h1v2h1v1h2v1h2z"/><path fill="currentColor" d="M23 10v1h-1v1h-1v2h1v3h-1v-1h-1v-1h-1v-1h-1v1h-1v1h-1v1h-1v-3h1v-2h-1v-1h-1v-1h3V8h1V7h1v1h1v2z"/></svg></span>홈</button>
    <button class="navbtn" data-tab="calendar"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>calendar-alt-solid</title><path fill="currentColor" d="M16 1h2v1h-2zM6 1h2v1H6zm17 4v4H1V5h1V4h3V2h1v5h2V2h1v2h6V2h1v5h2V2h1v2h3v1zm0 6v11h-1v1H2v-1H1V11z"/></svg></span>캘린더</button>
    <button class="navbtn" data-tab="todo"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>check-list-solid</title><path fill="currentColor" d="M23 6v1h-1v1H10V7H9V6h1V5h12v1zm-1 12h1v1h-1v1H10v-1H9v-1h1v-1h12zm0-6h1v1h-1v1H10v-1H9v-1h1v-1h12zM8 15v2H7v1H6v1H5v1H4v1H3v-1H2v-1H1v-2h1v1h1v1h1v-1h1v-1h1v-1h1v-1zm0-6v2H7v1H6v1H5v1H4v1H3v-1H2v-1H1v-2h1v1h1v1h1v-1h1v-1h1v-1h1V9zm0-6v2H7v1H6v1H5v1H4v1H3V8H2V7H1V5h1v1h1v1h1V6h1V5h1V4h1V3z"/><path fill="none" d="M0 0h24v24H0z"/></svg></span>할일</button>
    <button class="navbtn" data-tab="journal"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>book-solid</title><path fill="currentColor" d="M21 2V1H4v1H3v1H2v18h1v1h1v1h17v-1h1v-1h-1v-1h-1v-3h1v-1h1V2Zm-3 19H5v-1H4v-2h1v-1h13Z"/></svg></span>업무일지</button>
    <button class="navbtn" data-tab="notes"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>writing</title><path fill="currentColor" d="M23.505 7.501v2h-1v1h-1v-1h-1v-1h-1.001v-1h1v-1h2v1zm-2 3.001v1h-1v1h-1v1h-1.001v1h-1v1.001h-1v1h-1v1h-1.001v1h-3v-3h1v-1h1v-1h1v-1h1v-1h1v-1.001h1v-1h1v-1h1.001v1h1v1z"/><path fill="currentColor" d="M17.504 2.5v-1H2.5v1h-1v20.005h1v1h15.004v-1h1v-6.002h-1v1h-1v1h-1v1.001h-5.002v-5.001h1v-1h1v-1h1v-1h1.001v-1.001h1v-1h1v-1h1v-1h1V2.5zm-1 3H3.5v-1h13.003zm-2.001 3.002H3.5v-1h11.003zm-6.001 9.002H3.5v-1h5.002zM3.5 14.503v-1h6.002v1zm0-3v-1.001h9.003v1z"/></svg></span>메모</button>
    <button class="navbtn" data-tab="bookmarks"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>star-solid</title><path fill="currentColor" d="M23 8v2h-1v1h-1v1h-1v1h-1v1h-1v5h1v4h-2v-1h-2v-1h-2v-1h-2v1H9v1H7v1H5v-4h1v-5H5v-1H4v-1H3v-1H2v-1H1V8h7V6h1V4h1V2h1V1h2v1h1v2h1v2h1v2z"/></svg></span>즐겨찾기</button>
    <button class="navbtn" data-tab="stickers"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>heart</title><path fill="currentColor" d="M22 6V5h-1V4h-1V3h-6v1h-1v1h-2V4h-1V3H4v1H3v1H2v1H1v5h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h2v-1h1v-1h1v-1h1v-1h1v-1h1v-1h1v-1h1v-1h1v-1h1v-1h1V6zm-2 4v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-2v-1h-1v-1H9v-1H8v-1H7v-1H6v-1H5v-1H4v-1H3V7h1V6h1V5h4v1h1v1h1v1h2V7h1V6h1V5h4v1h1v1h1v3z"/></svg></span>꾸미기</button>
    <div class="sidebar-foot">출근부 찍었는지 확인</div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="greet">
        <div class="tape" style="width:70px; left:26px; top:-10px; transform:rotate(-5deg); background-color:var(--pink-soft);"></div>
        <div class="mascot" id="mascotFace"></div>
        <div class="txt">
          <div class="msg" id="greetMsg">안녕하세요!</div>
          <div class="sub" id="clockLine">-</div>
        </div>
      </div>
      <div class="quicklaunch">
        <button class="qbtn intra" id="btnIntra"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>tech-companies</title><path fill="currentColor" d="M11.502 1.5v22.005h1v-5.001h3.001v5.001h6.002V1.5zm6.002 1v2h-2v-2zm0 5.001h-2v-2h2zm0 3.001h-2v-2h2zm0 3h-2v-2h2zm0 3.001h-2v-2h2zM12.502 2.5h2v2h-2zm0 3h2v2.001h-2zm0 3.002h2v2h-2zm0 3h2v2h-2zm0 3.001h2v2h-2zm8.002 7.002h-4v-3.001h4zm0-5.002h-2v-2h2zm0-3h-2v-2h2zm0-3.001h-2v-2h2zm0-3h-2V5.5h2zm0-3.001h-2v-2h2zm-19.004 4v15.004h3v-4.001h3.001v4h3.001V8.502zm1 1h3v2.001h-3zm0 3.001h3v2h-3zm0 5.001v-2h3v2zm7.002 0h-3v-2h3zm0-3h-3v-2h3zm0-3h-3V9.501h3z"/></svg> 인트라허브</button>
        <button class="qbtn attend" id="btnAttend"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>business</title><path fill="currentColor" d="M22.505 15.503v7.002h-1v1H3.5v-1h-1v-7.002h7.002v2h6.001v-2z"/><path fill="currentColor" d="M14.503 15.503h-4v1h4zm0-2h-4v1h4z"/><path fill="currentColor" d="M22.505 5.5v-1h-6.002v-2h-1v-1H9.502v1h-1v2H2.5v1h-1v8.003h1v1h7.002v-2h6.001v2h7.002v-1h1V5.5zm-12.003-2h4.001v1h-4.001z"/></svg> 출근부</button>
        <button class="qbtn chat" id="btnChat"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>comment-solid</title><path fill="#ffffff" d="M23 8v6h-1v2h-1v1h-1v1h-2v1h-3v1H9v-1H7v1H6v1H1v-2h1v-1h1v-2H2v-2H1V8h1V6h1V5h1V4h2V3h3V2h6v1h3v1h2v1h1v1h1v2z"/></svg> 챗</button>
        <button class="qbtn music" id="btnMusic"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>headphones-solid</title><path fill="currentColor" d="M23 9v11h-1v2h-1v1h-3v-1h-1v-9h1v-1h3v2h1v-4h-1V8h-1V7h-1V6h-1V5h-1V4h-2V3H9v1H7v1H6v1H5v1H4v1H3v2H2v4h1v-2h3v1h1v9H6v1H3v-1H2v-2H1V9h1V7h1V6h1V5h1V4h1V3h2V2h8v1h2v1h1v1h1v1h1v1h1v2z"/></svg> 뮤직</button>
        <button class="iconbtn" id="btnInstall" title="앱으로 설치" hidden><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>install</title><path fill="currentColor" d="M11 3h2v9h4l-5 6-5-6h4zM4 16v4h16v-4h2v6H2v-6z"/></svg></button>
        <button class="iconbtn" id="btnTheme" title="다크모드"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>moon-solid</title><path fill="currentColor" d="M22 17v2h-1v1h-1v1h-2v1h-2v1h-6v-1H8v-1H6v-1H5v-1H4v-2H3v-2H2V9h1V7h1V5h1V4h1V3h2V2h2V1h5v1h-2v1h-2v1h-1v2H9v2H8v4h1v2h1v2h1v1h2v1h2v1h4v-1h2v-1z"/></svg></button>
        <button class="iconbtn" id="btnSettings" title="바로가기 설정"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>cog-solid</title><path fill="currentColor" d="M21 10V9h-1V7h1V5h-1V4h-1V3h-2v1h-2V3h-1V1h-4v2H9v1H7V3H5v1H4v1H3v2h1v2H3v1H1v4h2v1h1v2H3v2h1v1h1v1h2v-1h2v1h1v2h4v-2h1v-1h2v1h2v-1h1v-1h1v-2h-1v-2h1v-1h2v-4zm-11 0V9h4v1h1v4h-1v1h-4v-1H9v-4z"/></svg></button>
      </div>
    </div>

    <!-- HOME -->
    <section class="tab-panel active" data-tab="home">
      <div class="panel">
        <div class="tape" style="width:64px; left:30px; top:-10px; transform:rotate(4deg); background-color:var(--mint-soft);"></div>
        <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>sparkles-solid</title><path fill="currentColor" d="M23 18v2h-2v1h-1v2h-2v-2h-1v-1h-2v-2h2v-1h1v-2h2v2h1v1zm0-14v2h-2v1h-1v2h-2V7h-1V6h-2V4h2V3h1V1h2v2h1v1zm-6 7v2h-2v1h-2v1h-1v1h-1v2h-1v2H8v-2H7v-2H6v-1H5v-1H3v-1H1v-2h2v-1h2V9h1V8h1V6h1V4h2v2h1v2h1v1h1v1h2v1z"/></svg> 오늘의 책상</h2>
        <div class="grid2">
          <div class="card-mini">
            <div style="font-weight:800;margin-bottom:8px;"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>check-solid</title><path fill="currentColor" d="M23 5v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1H8v-1H7v-1H6v-1H5v-1H4v-1H3v-1H2v-1H1v-1h1v-1h1V9h1v1h1v1h1v1h1v1h1v1h2v-1h1v-1h1v-1h1v-1h1V9h1V8h1V7h1V6h1V5h1V4h1V3h1v1h1v1z"/></svg> 오늘 할 일 <span id="homeTodoCount" style="color:var(--ink-soft);font-weight:600;"></span></div>
            <div id="homeTodoList"></div>
          </div>
          <div class="card-mini">
            <div style="font-weight:800;margin-bottom:8px;"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>calendar-alt-solid</title><path fill="currentColor" d="M16 1h2v1h-2zM6 1h2v1H6zm17 4v4H1V5h1V4h3V2h1v5h2V2h1v2h6V2h1v5h2V2h1v2h3v1zm0 6v11h-1v1H2v-1H1V11z"/></svg> 다가오는 일정</div>
            <div id="homeEvents"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="tab-panel" data-tab="calendar">
      <div class="panel">
        <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>calendar-alt-solid</title><path fill="currentColor" d="M16 1h2v1h-2zM6 1h2v1H6zm17 4v4H1V5h1V4h3V2h1v5h2V2h1v2h6V2h1v5h2V2h1v2h3v1zm0 6v11h-1v1H2v-1H1V11z"/></svg> 캘린더</h2>
        <div class="cal-head">
          <button class="navarrow" id="calPrev"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>angle-left-solid</title><path fill="currentColor" d="M17 5v2h-1v1h-1v1h-1v1h-1v1h-1v2h1v1h1v1h1v1h1v1h1v2h-1v1h-2v-1h-1v-1h-1v-1h-1v-1h-1v-1H9v-1H8v-1H7v-2h1v-1h1V9h1V8h1V7h1V6h1V5h1V4h2v1z"/></svg></button>
          <div class="midgroup">
            <div class="label" id="calLabel">-</div>
            <button class="todaybtn" id="calToday">오늘</button>
          </div>
          <button class="navarrow" id="calNext"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>angle-right-solid</title><path fill="currentColor" d="M7 19v-2h1v-1h1v-1h1v-1h1v-1h1v-2h-1v-1h-1V9H9V8H8V7H7V5h1V4h2v1h1v1h1v1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1H8v-1z"/></svg></button>
        </div>
        <div class="cal-dows" id="calDows"></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot">
          <div class="cal-legend">
            <span class="lg lg-local">내 일정</span>
            <span class="lg lg-google">Google</span>
          </div>
          <button class="btn-ghost gcal-btn" id="gcalBtn">Google 캘린더 연결</button>
        </div>
        <div class="day-events" id="dayEvents"></div>
      </div>
    </section>

    <!-- TODO -->
    <section class="tab-panel" data-tab="todo">
      <div class="panel">
        <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>check-list-solid</title><path fill="currentColor" d="M23 6v1h-1v1H10V7H9V6h1V5h12v1zm-1 12h1v1h-1v1H10v-1H9v-1h1v-1h12zm0-6h1v1h-1v1H10v-1H9v-1h1v-1h12zM8 15v2H7v1H6v1H5v1H4v1H3v-1H2v-1H1v-2h1v1h1v1h1v-1h1v-1h1v-1h1v-1zm0-6v2H7v1H6v1H5v1H4v1H3v-1H2v-1H1v-2h1v1h1v1h1v-1h1v-1h1v-1h1V9zm0-6v2H7v1H6v1H5v1H4v1H3V8H2V7H1V5h1v1h1v1h1V6h1V5h1V4h1V3z"/><path fill="none" d="M0 0h24v24H0z"/></svg> 할일체크리스트</h2>
        <div class="todo-add">
          <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" maxlength="80">
          <button class="btn-round" id="todoAddBtn">추가</button>
        </div>
        <div class="filters">
          <button class="chip active" data-filter="all">전체</button>
          <button class="chip" data-filter="active">진행중</button>
          <button class="chip" data-filter="done">완료</button>
        </div>
        <div id="todoList"></div>
      </div>
    </section>

    <!-- JOURNAL -->
    <section class="tab-panel" data-tab="journal">
      <div class="panel">
        <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>book-solid</title><path fill="currentColor" d="M21 2V1H4v1H3v1H2v18h1v1h1v1h17v-1h1v-1h-1v-1h-1v-3h1v-1h1V2Zm-3 19H5v-1H4v-2h1v-1h13Z"/></svg> 업무일지</h2>
        <div class="journal-tools">
          <button class="btn-round" id="newEntryBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>plus-solid</title><path fill="currentColor" d="M23 11v2h-1v1h-8v8h-1v1h-2v-1h-1v-8H2v-1H1v-2h1v-1h8V2h1V1h2v1h1v8h8v1z"/></svg> 새 페이지 쓰기</button>
          <button class="btn-ghost" id="importMdBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>folder-open-solid</title><path fill="currentColor" d="M2 16H1V3h1V2h7v1h1v1h9v1h1v4H5v1H4v2H3v2H2z"/><path fill="currentColor" d="M23 10v2h-1v2h-1v2h-1v2h-1v3h-1v1H3v-1H2v-3h1v-2h1v-2h1v-2h1v-2z"/></svg> md 파일 가져오기</button>
          <input type="file" id="mdFileInput" accept=".md,.markdown,.txt" multiple style="display:none;">
        </div>
        <div class="editor" id="editorBox" style="display:none;">
          <input type="text" id="entryTitle" placeholder="제목">
          <textarea id="entryContent" placeholder="# 오늘의 업무&#10;- 한 일&#10;- 내일 할 일"></textarea>
          <div class="editor-actions">
            <button class="btn-round" id="saveEntryBtn">저장</button>
            <button class="btn-ghost" id="cancelEntryBtn">취소</button>
          </div>
        </div>
        <div class="book">
          <div class="toc" id="journalToc"></div>
          <div class="page" id="journalPage"></div>
        </div>
        <div class="pager">
          <button id="pagePrev"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>angle-left-solid</title><path fill="currentColor" d="M17 5v2h-1v1h-1v1h-1v1h-1v1h-1v2h1v1h1v1h1v1h1v1h1v2h-1v1h-2v-1h-1v-1h-1v-1h-1v-1h-1v-1H9v-1H8v-1H7v-2h1v-1h1V9h1V8h1V7h1V6h1V5h1V4h2v1z"/></svg> 이전 페이지</button>
          <span id="pageIndicator">0 / 0</span>
          <button id="pageNext">다음 페이지 <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>angle-right-solid</title><path fill="currentColor" d="M7 19v-2h1v-1h1v-1h1v-1h1v-1h1v-2h-1v-1h-1V9H9V8H8V7H7V5h1V4h2v1h1v1h1v1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1H8v-1z"/></svg></button>
        </div>
      </div>
    </section>

    <!-- NOTES -->
    <section class="tab-panel" data-tab="notes">
      <div class="panel">
        <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>writing</title><path fill="currentColor" d="M23.505 7.501v2h-1v1h-1v-1h-1v-1h-1.001v-1h1v-1h2v1zm-2 3.001v1h-1v1h-1v1h-1.001v1h-1v1.001h-1v1h-1v1h-1.001v1h-3v-3h1v-1h1v-1h1v-1h1v-1h1v-1.001h1v-1h1v-1h1.001v1h1v1z"/><path fill="currentColor" d="M17.504 2.5v-1H2.5v1h-1v20.005h1v1h15.004v-1h1v-6.002h-1v1h-1v1h-1v1.001h-5.002v-5.001h1v-1h1v-1h1v-1h1.001v-1.001h1v-1h1v-1h1v-1h1V2.5zm-1 3H3.5v-1h13.003zm-2.001 3.002H3.5v-1h11.003zm-6.001 9.002H3.5v-1h5.002zM3.5 14.503v-1h6.002v1zm0-3v-1.001h9.003v1z"/></svg> 메모장</h2>
        <div class="notes-grid" id="notesGrid"></div>
      </div>
    </section>

    <!-- BOOKMARKS -->
    <section class="tab-panel" data-tab="bookmarks">
      <div class="panel">
        <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>star-solid</title><path fill="currentColor" d="M23 8v2h-1v1h-1v1h-1v1h-1v1h-1v5h1v4h-2v-1h-2v-1h-2v-1h-2v1H9v1H7v1H5v-4h1v-5H5v-1H4v-1H3v-1H2v-1H1V8h7V6h1V4h1V2h1V1h2v1h1v2h1v2h1v2z"/></svg> 즐겨찾기</h2>
        <div class="tablet-frame">
          <div class="tablet-status"><span id="tabletClock">-</span><span>즐겨찾기</span></div>
          <div class="app-grid" id="bmGrid"></div>
        </div>
      </div>
    </section>

    <!-- STICKERS -->
    <section class="tab-panel" data-tab="stickers">
      <div class="panel">
        <h2 class="section-title">코르크판 꾸미기</h2>
        <div style="margin-bottom:10px;">
          <button class="btn-round" id="addPhotoBtn" style="font-size:13px;">사진 붙이기</button>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
        </div>
        <div class="sticker-palette" id="stickerPalette"></div>
        <div class="sticker-board" id="stickerBoard"></div>
        <div class="sticker-hint">스티커·사진을 클릭/업로드해서 붙이고, 드래그해서 옮기고, 더블클릭하면 뗄 수 있어요</div>
      </div>
    </section>
  </main>
</div>

<div class="modal-back" id="settingsModal">
  <div class="modal">
    <h3><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>cog-solid</title><path fill="currentColor" d="M21 10V9h-1V7h1V5h-1V4h-1V3h-2v1h-2V3h-1V1h-4v2H9v1H7V3H5v1H4v1H3v2h1v2H3v1H1v4h2v1h1v2H3v2h1v1h1v1h2v-1h2v1h1v2h4v-2h1v-1h2v1h2v-1h1v-1h1v-2h-1v-2h1v-1h2v-4zm-11 0V9h4v1h1v4h-1v1h-4v-1H9v-4z"/></svg> 설정</h3>
    <label>사이트 이름</label>
    <input type="text" id="setSiteName" placeholder="estdesk">
    <label>인트라허브 주소</label>
    <input type="text" id="setIntra" placeholder="https://intra.company.com">
    <label>출근부 주소</label>
    <input type="text" id="setAttend" placeholder="https://hr.company.com/attendance">
    <label>구글챗 주소</label>
    <input type="text" id="setChat" placeholder="https://chat.google.com">
    <label>유튜브뮤직 주소</label>
    <input type="text" id="setMusic" placeholder="https://music.youtube.com">
    <label>Google 캘린더 클라이언트 ID</label>
    <input type="text" id="setGoogleId" placeholder="000000-xxxx.apps.googleusercontent.com">
    <div class="modal-hint">Google Cloud Console에서 만든 OAuth 웹 클라이언트 ID입니다. 승인된 JavaScript 원본에 이 사이트 주소를 넣어두세요.</div>
    <div class="modal-actions">
      <button class="btn-ghost" id="settingsCancel">닫기</button>
      <button class="btn-round" id="settingsSave">저장</button>
    </div>
  </div>
</div>

<div class="modal-back" id="bmModal">
  <div class="modal">
    <h3>즐겨찾기 추가</h3>
    <label>이름</label>
    <input type="text" id="bmName" placeholder="예: 사내 위키">
    <label>주소</label>
    <input type="text" id="bmUrl" placeholder="https://...">
    <div class="modal-actions">
      <button class="btn-ghost" id="bmCancel">닫기</button>
      <button class="btn-round" id="bmSave">추가</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
